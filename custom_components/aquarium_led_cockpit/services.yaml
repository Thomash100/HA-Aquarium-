install_resources:
  name: Ressourcen installieren oder exportieren
  description: Kopiert die Lovelace-Simulator-Ressource der Integration in die Home-Assistant-Konfiguration.
  fields:
    config_entry_id:
      name: Aquarium-Konfiguration
      description: Waehlt das Aquarium aus, dessen Einstellungen fuer den Export genutzt werden. Bei mehreren Aquarien bitte gezielt auswaehlen.
      selector:
        config_entry:
          integration: aquarium_led_cockpit
    export_frontend_resources:
      name: Lovelace-Ressource exportieren
      description: Exportiert die Aquarium-LED-Simulator-Karte nach /config/www/aquarium_led_cockpit/.
      selector:
        boolean:
    overwrite_existing:
      name: Vorhandene Dateien ueberschreiben
      description: Ersetzt Dateien, die am Zielpfad bereits vorhanden sind.
      selector:
        boolean:

set_dashboard_status:
  name: Dashboard-Status setzen
  description: Aktualisiert den Live-Statussensor von Aquarium LED Cockpit aus einer Automation.
  fields:
    config_entry_id:
      name: Aquarium-Konfiguration
      description: Waehlt das Aquarium aus, dessen Live-Status aktualisiert werden soll. Bei mehreren Aquarien ist diese Auswahl erforderlich.
      selector:
        config_entry:
          integration: aquarium_led_cockpit
    status_json:
      name: Status-JSON
      description: Kompaktes JSON-Objekt mit dem Aquarium-Lichtstatus.
      required: true
      selector:
        text:
          multiline: true
