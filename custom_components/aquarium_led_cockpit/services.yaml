install_resources:
  name: Ressourcen installieren oder exportieren
  description: Kopiert Blueprint- und Dashboard-Ressourcen der Integration in die Home-Assistant-Konfiguration.
  fields:
    config_entry_id:
      name: Aquarium-Konfiguration
      description: Waehlt das Aquarium aus, dessen Einstellungen fuer den Export genutzt werden. Bei mehreren Aquarien bitte gezielt auswaehlen.
      selector:
        config_entry:
          integration: aquarium_led_cockpit
    install_blueprint:
      name: Optionalen Legacy-Blueprint installieren
      description: Exportiert die alte Automation-Blueprint nur fuer Kompatibilitaets- oder Experten-Setups. Fuer die normale Integrationssteuerung ist sie nicht mehr erforderlich.
      selector:
        boolean:
    export_dashboard_snippets:
      name: Dashboard-Snippets exportieren
      description: Exportiert die YAML-Snippets der Dashboard-Karten nach /config/aquarium_led_cockpit/dashboard/.
      selector:
        boolean:
    export_legacy_files:
      name: Legacy-Dateien exportieren
      description: Exportiert das input_text-Helferpaket und die aelteren Dashboard-Varianten.
      selector:
        boolean:
    overwrite_existing:
      name: Vorhandene Dateien ueberschreiben
      description: Ersetzt Dateien, die am Zielpfad bereits vorhanden sind.
      selector:
        boolean:

set_dashboard_status:
  name: Dashboard-Status setzen
  description: Aktualisiert den Live-Statussensor von Aquarium LED Cockpit aus einer Automation.
  fields:
    config_entry_id:
      name: Aquarium-Konfiguration
      description: Waehlt das Aquarium aus, dessen Live-Status aktualisiert werden soll. Bei mehreren Aquarien ist diese Auswahl erforderlich.
      selector:
        config_entry:
          integration: aquarium_led_cockpit
    status_json:
      name: Status-JSON
      description: Kompaktes JSON-Objekt mit dem Aquarium-Lichtstatus.
      required: true
      selector:
        text:
          multiline: true
