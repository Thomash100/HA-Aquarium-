type: vertical-stack
cards:
  - type: markdown
    content: >-
      ## Aquarium Verlauf 24h

      Diese Standardkarte nutzt nur die Cockpit-Status-Entitaet, die von der
      Integration angelegt wird. Wenn du eigene Shelly- oder Tibber-Sensoren
      anzeigen moechtest, fuege sie hier zusaetzlich mit ihren echten
      Entity-IDs ein.
  - type: history-graph
    title: Aquarium LED Status 24h
    hours_to_show: 24
    fit_y_data: true
    entities:
      - entity: sensor.aquarium_led_cockpit_status
        name: Cockpit Status
  - type: entities
    title: Verwendete Entitaet
    show_header_toggle: false
    entities:
      - entity: sensor.aquarium_led_cockpit_status
        name: Aquarium LED Cockpit Status
